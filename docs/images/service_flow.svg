<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" font-family="'Apple SD Gothic Neo','Pretendard','Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <style>
      .t { fill: #24352B; }
      .h { font-size: 22px; font-weight: 800; }
      .d { font-size: 14.5px; fill: #4C5E52; }
      .api { font-family: 'SF Mono','Menlo','Consolas',monospace; font-size: 12.5px; fill: #3E5A48; font-weight: 600; }
      .num { font-size: 17px; font-weight: 800; fill: #FFFDF5; }
    </style>
  </defs>

  <!-- 마당 -->
  <rect width="1200" height="470" rx="28" fill="#8FC79A"/>
  <circle cx="1120" cy="70" r="120" fill="#9FD0A8"/>
  <circle cx="90" cy="440" r="110" fill="#9FD0A8"/>

  <!-- 제목 -->
  <text x="40" y="58" font-size="30" font-weight="900" fill="#FFFDF5" stroke="#24352B" stroke-width="5" paint-order="stroke" letter-spacing="1">마중은 이렇게 일해요</text>
  <text x="40" y="88" font-size="15" fill="#24352B" font-weight="600">가게가 문을 닫는 순간부터, 그 가게가 하던 일을 마을이 이어받기까지 5단계</text>

  <!-- 길 -->
  <path d="M20 432 C 260 400, 420 450, 600 428 S 960 404, 1180 432" fill="none" stroke="#F4E9C9" stroke-width="20" stroke-linecap="round"/>
  <path d="M20 432 C 260 400, 420 450, 600 428 S 960 404, 1180 432" fill="none" stroke="#FFFDF5" stroke-width="3" stroke-dasharray="14 12" stroke-linecap="round"/>

  <!-- 집 5채: x = 30 + i*232, 폭 196 -->
  <!-- ① 등록 -->
  <g transform="translate(30 0)">
    <rect x="140" y="108" width="20" height="34" rx="3" fill="#FFFDF5"/>
    <path d="M-10 160 Q -10 154 -4 150 L 92 112 Q 98 110 104 112 L 200 150 Q 206 154 206 160 Z" fill="#FFFDF5"/>
    <rect x="0" y="158" width="196" height="234" rx="16" fill="#FFFDF5"/>
    <circle cx="98" cy="140" r="17" fill="#4F8A68"/><text x="98" y="146" text-anchor="middle" class="num">1</text>
    <!-- 아이콘: 차양 가게 + 팻말 -->
    <g transform="translate(58 176)">
      <rect x="4" y="16" width="72" height="40" rx="4" fill="#F7EBD8"/>
      <path d="M0 18 H80 L74 4 H6 Z" fill="#F5A68A"/>
      <path d="M14 4 l-4 14 M30 4 l-2 14 M50 4 l2 14 M66 4 l4 14" stroke="#FFFDF5" stroke-width="5"/>
      <rect x="32" y="34" width="16" height="22" rx="2" fill="#C99A73"/>
      <rect x="50" y="38" width="44" height="17" rx="3" fill="#FFFDF5" stroke="#E0604E" stroke-width="2" transform="rotate(10 72 46)"/>
      <text x="72" y="50.5" text-anchor="middle" font-size="9.5" font-weight="800" fill="#E0604E" transform="rotate(10 72 46)">폐업 예정</text>
    </g>
    <text x="98" y="268" text-anchor="middle" class="t h">시설 등록</text>
    <text x="98" y="294" text-anchor="middle" class="d">문을 닫을 가게와</text>
    <text x="98" y="314" text-anchor="middle" class="d">폐업 예정일을 입력</text>
    <rect x="34" y="342" width="128" height="28" rx="14" fill="#EAF4EC"/>
    <text x="98" y="361" text-anchor="middle" class="api">POST /closures</text>
  </g>

  <!-- ② AI 기능 분리 -->
  <g transform="translate(262 0)">
    <rect x="34" y="104" width="20" height="38" rx="3" fill="#FFFDF5"/>
    <path d="M-10 160 Q -10 152 -2 148 C 40 130, 70 108, 98 108 C 126 108, 156 130, 198 148 Q 206 152 206 160 Z" fill="#FFFDF5"/>
    <rect x="0" y="158" width="196" height="234" rx="16" fill="#FFFDF5"/>
    <circle cx="98" cy="140" r="17" fill="#4F8A68"/><text x="98" y="146" text-anchor="middle" class="num">2</text>
    <!-- 아이콘: 4개 기능 조각 -->
    <g transform="translate(46 180)">
      <rect x="0" y="0" width="48" height="24" rx="12" fill="#A3D9B8"/><text x="24" y="16.5" text-anchor="middle" font-size="11" font-weight="800" fill="#3E8A5E">생필품</text>
      <rect x="56" y="0" width="48" height="24" rx="12" fill="#F5B8A0"/><text x="80" y="16.5" text-anchor="middle" font-size="11" font-weight="800" fill="#B5603F">신선</text>
      <rect x="0" y="32" width="48" height="24" rx="12" fill="#F3DA86"/><text x="24" y="48.5" text-anchor="middle" font-size="11" font-weight="800" fill="#9A7A1E">무거운</text>
      <rect x="56" y="32" width="48" height="24" rx="12" fill="#A9CDE6"/><text x="80" y="48.5" text-anchor="middle" font-size="11" font-weight="800" fill="#3D6F92">거점</text>
    </g>
    <text x="98" y="268" text-anchor="middle" class="t h">AI 기능 분리</text>
    <text x="98" y="294" text-anchor="middle" class="d">LLM이 가게를 4가지</text>
    <text x="98" y="314" text-anchor="middle" class="d">생활기능으로 나눔</text>
    <rect x="14" y="342" width="168" height="28" rx="14" fill="#EAF4EC"/>
    <text x="98" y="361" text-anchor="middle" class="api">GET …/functions</text>
  </g>

  <!-- ③ 담당자 확인 -->
  <g transform="translate(494 0)">
    <rect x="150" y="112" width="20" height="30" rx="3" fill="#FFFDF5"/>
    <path d="M-10 160 Q -8 152 0 150 L 38 124 Q 46 118 56 118 L 140 118 Q 150 118 158 124 L 196 150 Q 204 152 206 160 Z" fill="#FFFDF5"/>
    <rect x="0" y="158" width="196" height="234" rx="16" fill="#FFFDF5"/>
    <circle cx="98" cy="140" r="17" fill="#4F8A68"/><text x="98" y="146" text-anchor="middle" class="num">3</text>
    <!-- 아이콘: 체크리스트 -->
    <g transform="translate(62 176)">
      <rect x="0" y="0" width="72" height="60" rx="8" fill="#EAF4EC"/>
      <path d="M12 18 l6 6 l10 -12" stroke="#4F8A68" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="34" y="14" width="28" height="6" rx="3" fill="#B7CBB9"/>
      <path d="M12 42 l6 6 l10 -12" stroke="#4F8A68" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="34" y="38" width="22" height="6" rx="3" fill="#B7CBB9"/>
    </g>
    <text x="98" y="268" text-anchor="middle" class="t h">담당자 확인</text>
    <text x="98" y="294" text-anchor="middle" class="d">애매한 기능은 사람이</text>
    <text x="98" y="314" text-anchor="middle" class="d">확인·제외·수정</text>
    <rect x="14" y="342" width="168" height="28" rx="14" fill="#EAF4EC"/>
    <text x="98" y="361" text-anchor="middle" class="api">PATCH …/functions</text>
  </g>

  <!-- ④ 상속안 -->
  <g transform="translate(726 0)">
    <rect x="132" y="106" width="20" height="36" rx="3" fill="#FFFDF5"/>
    <path d="M-10 160 Q -8 150 2 148 C 30 142, 52 112, 86 112 C 116 112, 132 136, 160 136 C 184 136, 200 146, 206 160 Z" fill="#FFFDF5"/>
    <rect x="0" y="158" width="196" height="234" rx="16" fill="#FFFDF5"/>
    <circle cx="98" cy="140" r="17" fill="#4F8A68"/><text x="98" y="146" text-anchor="middle" class="num">4</text>
    <!-- 아이콘: 한 곳에서 세 자원으로 -->
    <g transform="translate(40 176)">
      <circle cx="18" cy="30" r="12" fill="#F5A68A"/>
      <path d="M30 30 C 56 30, 60 8, 84 8 M30 30 H84 M30 30 C 56 30, 60 52, 84 52" stroke="#8FC79A" stroke-width="3" fill="none" stroke-dasharray="4 4"/>
      <rect x="86" y="0" width="30" height="16" rx="4" fill="#F3DA86"/>
      <path d="M86 30 l15 -10 l15 10 v12 h-30 Z" fill="#A9CDE6"/>
      <rect x="86" y="44" width="30" height="16" rx="8" fill="#A3D9B8"/>
    </g>
    <text x="98" y="268" text-anchor="middle" class="t h">기능별 상속안</text>
    <text x="98" y="294" text-anchor="middle" class="d">이동장터·농협·경로당 등</text>
    <text x="98" y="314" text-anchor="middle" class="d">기존 자원을 점수로 추천</text>
    <rect x="14" y="342" width="168" height="28" rx="14" fill="#EAF4EC"/>
    <text x="98" y="361" text-anchor="middle" class="api">GET …/inheritance</text>
  </g>

  <!-- ⑤ 공백 변화 -->
  <g transform="translate(958 0)">
    <rect x="40" y="110" width="20" height="32" rx="3" fill="#FFFDF5"/>
    <path d="M-10 160 Q -10 154 -4 150 L 92 112 Q 98 110 104 112 L 200 150 Q 206 154 206 160 Z" fill="#FFFDF5"/>
    <rect x="0" y="158" width="196" height="234" rx="16" fill="#FFFDF5"/>
    <circle cx="98" cy="140" r="17" fill="#4F8A68"/><text x="98" y="146" text-anchor="middle" class="num">5</text>
    <!-- 아이콘: 막대 163 → 125 -->
    <g transform="translate(52 176)">
      <rect x="6" y="4" width="34" height="52" rx="6" fill="#F5B8A0"/>
      <rect x="56" y="18" width="34" height="38" rx="6" fill="#A3D9B8"/>
      <text x="23" y="34" text-anchor="middle" font-size="12" font-weight="800" fill="#FFFDF5">163</text>
      <text x="73" y="42" text-anchor="middle" font-size="12" font-weight="800" fill="#24352B">125</text>
      <path d="M42 12 Q 50 4 56 14" stroke="#4F8A68" stroke-width="2.5" fill="none" marker-end="none"/>
    </g>
    <text x="98" y="268" text-anchor="middle" class="t h">공백 변화</text>
    <text x="98" y="294" text-anchor="middle" class="d">상속 전후로 공백 인구가</text>
    <text x="98" y="314" text-anchor="middle" class="d">얼마나 줄어드는지</text>
    <rect x="34" y="342" width="128" height="28" rx="14" fill="#EAF4EC"/>
    <text x="98" y="361" text-anchor="middle" class="api">GET …/gap</text>
  </g>

  <!-- 집 사이 화살표 -->
  <g fill="#FFFDF5" stroke="#24352B" stroke-width="2">
    <circle cx="242" cy="275" r="14"/><circle cx="474" cy="275" r="14"/><circle cx="706" cy="275" r="14"/><circle cx="938" cy="275" r="14"/>
  </g>
  <g fill="none" stroke="#24352B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M238 268 l7 7 l-7 7"/><path d="M470 268 l7 7 l-7 7"/><path d="M702 268 l7 7 l-7 7"/><path d="M934 268 l7 7 l-7 7"/>
  </g>
</svg>
