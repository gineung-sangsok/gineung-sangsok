<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" font-family="'Apple SD Gothic Neo','Pretendard','Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <style>
      .ink { fill: #24352B; }
      .sub { fill: #4C5E52; }
      .mono { font-family: 'SF Mono','Menlo','Consolas',monospace; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#24352B"/>
    </marker>
  </defs>

  <!-- 마당 -->
  <rect width="1200" height="640" rx="28" fill="#8FC79A"/>
  <circle cx="1150" cy="600" r="150" fill="#9FD0A8"/>
  <circle cx="40" cy="40" r="110" fill="#9FD0A8"/>

  <text x="40" y="58" font-size="30" font-weight="900" fill="#FFFDF5" stroke="#24352B" stroke-width="5" paint-order="stroke" letter-spacing="1">마중의 AI는 이렇게 생각해요</text>
  <text x="40" y="88" font-size="15" font-weight="600" class="ink">① 생활기능 분리 → 담당자 확인 → ② 상속안 추천 → ③ 공백 분석</text>

  <!-- 입력 데이터 -->
  <g transform="translate(40 120)">
    <rect width="200" height="470" rx="18" fill="#FFFDF5"/>
    <text x="100" y="38" text-anchor="middle" font-size="18" font-weight="800" class="ink">입력 데이터</text>
    <text x="100" y="60" text-anchor="middle" font-size="12.5" class="sub">임실군 공공데이터</text>
    <g font-size="13.5" font-weight="700" class="ink">
      <rect x="18" y="82" width="164" height="58" rx="12" fill="#F7EBD8"/>
      <text x="32" y="106">식료품점</text><text x="32" y="127" font-size="12" font-weight="500" class="sub">155곳 · 상가정보·인허가</text>
      <rect x="18" y="152" width="164" height="58" rx="12" fill="#E3F0F7"/>
      <text x="32" y="176">경로당·복지기관</text><text x="32" y="197" font-size="12" font-weight="500" class="sub">368곳</text>
      <rect x="18" y="222" width="164" height="58" rx="12" fill="#EAF4EC"/>
      <text x="32" y="246">인구 격자</text><text x="32" y="267" font-size="12" font-weight="500" class="sub">131개 법정리 · 2.97만 명</text>
      <rect x="18" y="292" width="164" height="58" rx="12" fill="#F4F0DC"/>
      <text x="32" y="316">도로·버스정류장</text><text x="32" y="337" font-size="12" font-weight="500" class="sub">OSM · 국토교통부</text>
      <rect x="18" y="362" width="164" height="58" rx="12" fill="#FBE6DD"/>
      <text x="32" y="386">이동장터 노선</text><text x="32" y="407" font-size="12" font-weight="500" class="sub">시범 노선 · 면 단위</text>
    </g>
  </g>

  <!-- ① 생활기능 분리 (집) -->
  <g transform="translate(290 120)">
    <rect x="300" y="-8" width="22" height="34" rx="3" fill="#FFFDF5"/>
    <path d="M-10 40 Q -10 32 -2 28 C 80 10, 140 -6, 190 -6 C 240 -6, 300 10, 382 28 Q 390 32 390 40 Z" fill="#FFFDF5"/>
    <rect x="0" y="38" width="380" height="250" rx="18" fill="#FFFDF5"/>
    <circle cx="36" cy="72" r="16" fill="#4F8A68"/><text x="36" y="78" text-anchor="middle" font-size="16" font-weight="800" fill="#FFFDF5">1</text>
    <text x="62" y="79" font-size="20" font-weight="800" class="ink">생활기능 분리</text>

    <rect x="20" y="100" width="164" height="78" rx="14" fill="#EAF4EC"/>
    <text x="102" y="126" text-anchor="middle" font-size="14.5" font-weight="800" class="ink">LLM 태거</text>
    <text x="102" y="146" text-anchor="middle" font-size="12" class="sub mono">gpt-5.4-mini</text>
    <text x="102" y="164" text-anchor="middle" font-size="11.5" class="sub">구조화 출력 · 프롬프트 v4</text>

    <rect x="196" y="100" width="164" height="78" rx="14" fill="#F4F0DC"/>
    <text x="278" y="126" text-anchor="middle" font-size="14.5" font-weight="800" class="ink">키워드 규칙</text>
    <text x="278" y="146" text-anchor="middle" font-size="12" class="sub">베이스라인</text>
    <text x="278" y="164" text-anchor="middle" font-size="11.5" class="sub">업종·이름·법정리 규칙</text>

    <!-- 결합 -->
    <path d="M102 180 V194 H190 M278 180 V194 H190 V204" stroke="#24352B" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <text x="190" y="228" text-anchor="middle" font-size="12.5" font-weight="700" class="ink">F01~F03은 LLM · F04는 규칙</text>
    <g transform="translate(26 240)">
      <rect x="0" y="0" width="78" height="26" rx="13" fill="#A3D9B8"/><text x="39" y="17.5" text-anchor="middle" font-size="12" font-weight="800" fill="#3E8A5E">F01 생필품</text>
      <rect x="84" y="0" width="78" height="26" rx="13" fill="#F5B8A0"/><text x="123" y="17.5" text-anchor="middle" font-size="12" font-weight="800" fill="#B5603F">F02 신선</text>
      <rect x="168" y="0" width="78" height="26" rx="13" fill="#F3DA86"/><text x="207" y="17.5" text-anchor="middle" font-size="12" font-weight="800" fill="#9A7A1E">F03 무거운</text>
      <rect x="252" y="0" width="78" height="26" rx="13" fill="#A9CDE6"/><text x="291" y="17.5" text-anchor="middle" font-size="12" font-weight="800" fill="#3D6F92">F04 거점</text>
    </g>
  </g>

  <!-- 확신도 + 평가 -->
  <g transform="translate(290 430)">
    <rect width="380" height="160" rx="18" fill="#FFFDF5"/>
    <text x="20" y="32" font-size="15" font-weight="800" class="ink">확신도 3단계</text>
    <rect x="20" y="46" width="340" height="16" rx="8" fill="#EEF2EC"/>
    <rect x="20" y="46" width="136" height="16" rx="8" fill="#E6E6E2"/>
    <rect x="156" y="46" width="68" height="16" fill="#F3DA86"/>
    <rect x="224" y="46" width="136" height="16" rx="8" fill="#A3D9B8"/>
    <rect x="224" y="46" width="12" height="16" fill="#A3D9B8"/>
    <text x="88" y="80" text-anchor="middle" font-size="11.5" class="sub">0.4 미만 버림</text>
    <text x="190" y="80" text-anchor="middle" font-size="11.5" font-weight="700" fill="#9A7A1E">담당자 확인</text>
    <text x="292" y="80" text-anchor="middle" font-size="11.5" font-weight="700" fill="#3E8A5E">0.6 이상 확정</text>
    <line x1="20" y1="98" x2="360" y2="98" stroke="#E3EBE0" stroke-width="1.5"/>
    <text x="20" y="122" font-size="13" font-weight="800" class="ink">새 표본 50건 공정 평가 (LLM)</text>
    <text x="20" y="146" font-size="13" class="sub">확정 정밀도 <tspan font-weight="800" fill="#3E8A5E">0.91</tspan> · 확인 포함 재현율 <tspan font-weight="800" fill="#3E8A5E">0.96</tspan> · 라벨러 κ 0.55</text>
  </g>

  <!-- 담당자 확인 배지 -->
  <g transform="translate(686 230)">
    <rect width="70" height="70" rx="35" fill="#FFFDF5" stroke="#24352B" stroke-width="2"/>
    <path d="M22 36 l9 9 l17 -19" stroke="#4F8A68" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="35" y="92" text-anchor="middle" font-size="12.5" font-weight="800" class="ink">담당자 확인</text>
  </g>

  <!-- ② 상속안 추천 (집) -->
  <g transform="translate(772 120)">
    <rect x="40" y="-6" width="22" height="32" rx="3" fill="#FFFDF5"/>
    <path d="M-10 40 Q -8 32 0 30 L 52 6 Q 60 2 70 2 L 320 2 Q 330 2 338 6 L 388 30 Q 396 32 398 40 Z" fill="#FFFDF5"/>
    <rect x="0" y="38" width="388" height="250" rx="18" fill="#FFFDF5"/>
    <circle cx="36" cy="72" r="16" fill="#4F8A68"/><text x="36" y="78" text-anchor="middle" font-size="16" font-weight="800" fill="#FFFDF5">2</text>
    <text x="62" y="79" font-size="20" font-weight="800" class="ink">기능별 상속안 추천</text>
    <text x="22" y="108" font-size="12.5" class="sub">같은 기능을 하는 기존 자원을 5개 지표 가중합으로 비교</text>
    <g font-size="13" font-weight="700" class="ink">
      <text x="22" y="140">거리</text><rect x="92" y="128" width="210" height="16" rx="8" fill="#EEF2EC"/><rect x="92" y="128" width="210" height="16" rx="8" fill="#A3D9B8"/><text x="314" y="141" class="sub">0.35</text>
      <text x="22" y="168">생활권</text><rect x="92" y="156" width="210" height="16" rx="8" fill="#EEF2EC"/><rect x="92" y="156" width="150" height="16" rx="8" fill="#A3D9B8"/><text x="314" y="169" class="sub">0.25</text>
      <text x="22" y="196">배달</text><rect x="92" y="184" width="210" height="16" rx="8" fill="#EEF2EC"/><rect x="92" y="184" width="90" height="16" rx="8" fill="#F3DA86"/><text x="314" y="197" class="sub">0.15</text>
      <text x="22" y="224">교통</text><rect x="92" y="212" width="210" height="16" rx="8" fill="#EEF2EC"/><rect x="92" y="212" width="90" height="16" rx="8" fill="#A9CDE6"/><text x="314" y="225" class="sub">0.15</text>
      <text x="22" y="252">운영시간</text><rect x="92" y="240" width="210" height="16" rx="8" fill="#EEF2EC"/><rect x="92" y="240" width="60" height="16" rx="8" fill="#F5B8A0"/><text x="314" y="253" class="sub">0.10</text>
    </g>
    <text x="22" y="278" font-size="11.5" class="sub">확인 안 된 자원은 needs_officer_check · 0.45 미만이면 이어받을 곳 없음</text>
  </g>

  <!-- ③ 공백 분석 -->
  <g transform="translate(772 430)">
    <rect width="388" height="160" rx="18" fill="#FFFDF5"/>
    <circle cx="36" cy="32" r="16" fill="#4F8A68"/><text x="36" y="38" text-anchor="middle" font-size="16" font-weight="800" fill="#FFFDF5">3</text>
    <text x="62" y="39" font-size="20" font-weight="800" class="ink">상속 전후 공백 분석</text>
    <text x="22" y="68" font-size="12.5" class="sub">제공처까지 1km 초과 → 공백 · 이동장터 방문 → 부분 해소</text>
    <g transform="translate(22 82)">
      <rect x="0" y="0" width="150" height="58" rx="12" fill="#FBE6DD"/>
      <text x="75" y="24" text-anchor="middle" font-size="12" class="sub">상속안 없을 때</text>
      <text x="75" y="48" text-anchor="middle" font-size="22" font-weight="900" fill="#B5603F">163명</text>
      <path d="M160 29 H186" stroke="#24352B" stroke-width="2.5" marker-end="url(#arrow)"/>
      <rect x="194" y="0" width="150" height="58" rx="12" fill="#EAF4EC"/>
      <text x="269" y="24" text-anchor="middle" font-size="12" class="sub">상속안 반영 후</text>
      <text x="269" y="48" text-anchor="middle" font-size="22" font-weight="900" fill="#3E8A5E">125명</text>
    </g>
  </g>

  <!-- 흐름 화살표 -->
  <g stroke="#24352B" stroke-width="2.5" fill="none">
    <path d="M244 300 H284" marker-end="url(#arrow)"/>
    <path d="M674 290 H684" marker-end="url(#arrow)"/>
    <path d="M758 265 H768" marker-end="url(#arrow)"/>
    <path d="M966 410 V424" marker-end="url(#arrow)"/>
  </g>
</svg>
